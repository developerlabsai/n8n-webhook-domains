version: '3.8'

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped

    # Only expose on localhost - nginx will handle external access
    ports:
      - "127.0.0.1:5678:5678"

    environment:
      # Domain Configuration
      - N8N_HOST=yourdomain.com
      - N8N_PORT=5678
      - N8N_PROTOCOL=https

      # Webhook Configuration (CRITICAL - This fixes the 0.0.0.0 issue)
      - WEBHOOK_URL=https://yourdomain.com/

      # Timezone (Change to your timezone)
      # See: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
      - GENERIC_TIMEZONE=America/New_York

      # Environment
      - NODE_ENV=production

      # Editor Base URL
      - N8N_EDITOR_BASE_URL=https://yourdomain.com/

      # Security
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=ChangeThisPassword123!

      # Encryption (Generate with: openssl rand -hex 32)
      - N8N_ENCRYPTION_KEY=change-this-to-a-random-32-character-hex-string

      # Metrics (optional)
      - N8N_METRICS=false

      # Log Level
      - N8N_LOG_LEVEL=info

      # Execution Process
      - EXECUTIONS_PROCESS=main

      # Maximum Payload Size
      - N8N_PAYLOAD_SIZE_MAX=16

      # Custom Nodes (optional)
      # - N8N_CUSTOM_EXTENSIONS=/home/node/.n8n/custom

    volumes:
      # Persistent data storage
      - n8n_data:/home/node/.n8n

      # Optional: Local files directory
      - ./local-files:/files

      # Optional: Custom nodes directory
      # - ./custom-nodes:/home/node/.n8n/custom

    networks:
      - n8n-network

    # Health check
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Resource limits (adjust based on your EC2 instance size)
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

volumes:
  n8n_data:
    driver: local
    # Optional: Specify custom driver options for backups
    # driver_opts:
    #   type: none
    #   device: /path/to/data
    #   o: bind

networks:
  n8n-network:
    driver: bridge
    # Optional: Custom network configuration
    # ipam:
    #   config:
    #     - subnet: 172.28.0.0/16
